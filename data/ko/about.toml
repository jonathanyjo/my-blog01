[[sections]]
type = "intro"
content = """안녕하세요! 저는 현재 **DNA Lab**의 CEO이자 리드 개발자로 활동하고 있는 Jonathan Y Jo입니다.

단순한 개발을 넘어, AI 기술이 실질적인 비즈니스 가치를 창출하고 biotech와 융합하여 난제를 해결하는 데 깊은 관심을 가지고 있습니다. 현재는 AI SaaS인 'Sol AI' 개발과 Bio-AI 애플리케이션 구축에 전념하고 있습니다."""

[[sections]]
type = "current"
content = """현재 **DNA Lab**을 운영하며 AI 기반 텍스트 분석 및 생성 모듈, AI communication 개발에 집중하고 있습니다. 특히 AI Wrapper 서비스인 **'Sol AI'**를 통해 복잡한 AI 기술을 대중이 쉽게 사용할 수 있도록 만드는 프로젝트를 리딩하고 있습니다.

**Core Expertise:**
- **AI & LLM Engineering** — Gemma, Mistral, Qwen 등 오픈소스 모델 활용, wrapper, prompt engineering
- **Bio-informatics** — 생물학적 데이터 분석 및 AI 모델 적용 연구  
- **Full-Stack Development** — React와 fast api 기반의 확장 가능한 아키텍처 설계
- **Business Strategy** — 글로벌 마켓 분석 경험을 바탕으로 한 비즈니스 모델 구축"""

[[sections]]
type = "opportunity"
title = "함께할 동료를 찾습니다"
content = """AI와 생명공학의 교차점에서 혁신적인 솔루션을 함께 만들어갈 동료를 찾고 있습니다. 다양한 배경의 개발자, 데이터 사이언티스트, 제품 매니저와 협업을 기대합니다."""

